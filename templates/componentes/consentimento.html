{% load static %}
{% comment %}
Aviso de consentimento de medição (LGPD) — serve o site público e as páginas de
captação. Nasce `hidden`: quem já decidiu nunca o vê, e o JS só o mostra quando
não há decisão guardada. As tags de medição ficam como
<script type="text/plain" data-consentimento> e só são ligadas no "Aceitar".

As cores vêm dos tokens do CRM quando existem (`var(--lampiao, …)`) e caem na
paleta da marca no site, que não carrega o app.css.
{% endcomment %}
<section id="consentimento" class="consent" role="region" aria-label="Aviso de cookies e medição" hidden aria-hidden="true">
  <div class="consent-caixa">
    <p class="consent-txt">
      <strong>Cookies e medição.</strong>
      Usamos cookies para entender como o site é usado e melhorar a experiência de reserva.
      Nada é carregado antes da sua escolha.
      <a href="{% url 'core:politica_privacidade' %}">Política de privacidade</a>.
    </p>
    <div class="consent-acoes">
      <button type="button" class="consent-btn consent-sim" data-consent-aceitar>Aceitar</button>
      <button type="button" class="consent-btn consent-nao" data-consent-recusar>Recusar</button>
    </div>
  </div>
</section>
<style>
  .consent {
    position: fixed; z-index: 90; left: 0; right: 0; bottom: 0;
    padding: 0 16px 16px;
    font-family: inherit;
  }
  .consent[hidden] { display: none; }
  .consent-caixa {
    display: flex; align-items: center; gap: 16px 20px; flex-wrap: wrap;
    max-width: 960px; margin: 0 auto; padding: 16px 20px;
    background: var(--superficie, #FFFFFF);
    color: var(--tinta, #2C2722);
    border: 1px solid var(--fio-forte, rgba(79, 44, 29, .22));
    border-radius: var(--raio, 14px);
    box-shadow: 0 18px 44px rgba(5, 28, 44, .22);
  }
  .consent-txt { flex: 1 1 320px; margin: 0; font-size: 14px; line-height: 1.55; }
  .consent-txt a { color: var(--madeira, #4F2C1D); text-decoration: underline; }
  .consent-acoes { display: flex; gap: 10px; flex: 0 0 auto; }
  /* Aceitar e Recusar com o MESMO peso: mesmo tamanho, mesma fonte, mesma área
     de toque (44px). O que muda é só a cor — nada de "recusar" escondido. */
  .consent-btn {
    min-height: 44px; min-width: 116px; padding: 11px 20px;
    font: inherit; font-size: 14px; font-weight: 700; line-height: 1;
    border-radius: 999px; cursor: pointer;
  }
  .consent-sim {
    color: var(--noturno, #051C2C);
    background: var(--lampiao, #D7A048);
    border: 1px solid var(--lampiao, #D7A048);
  }
  .consent-nao {
    color: var(--tinta, #2C2722);
    background: var(--superficie-2, #F7F5F1);
    border: 1px solid var(--fio-forte, rgba(79, 44, 29, .3));
  }
  .consent-btn:hover { filter: brightness(.97); }
  .consent-btn:active { transform: translateY(1px); }
  .consent-btn:focus-visible {
    outline: 2px solid var(--madeira, #4F2C1D);
    outline-offset: 2px;
    box-shadow: 0 0 0 3px rgba(215, 160, 72, .35);
  }
  @media (max-width: 520px) {
    .consent-acoes { width: 100%; }
    .consent-btn { flex: 1; }
  }
</style>
<script src="{% static 'js/consentimento.js' %}" defer></script>
