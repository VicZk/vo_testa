{% load static %}
{% comment %}
Aviso de consentimento de medição (LGPD) — serve o site público e as páginas de
captação. Nasce `hidden`: quem já decidiu nunca o vê, e o JS só o mostra quando
não há decisão guardada. As tags de medição ficam como
<script type="text/plain" data-consentimento> e só são ligadas no "Aceitar".

As cores vêm dos tokens do CRM quando existem (`var(--lampiao, …)`) e caem na
paleta da marca no site, que não carrega o app.css.
{% endcomment %}
<section id="consentimento" class="aviso-cookies" role="region" aria-label="Aviso de cookies e medição" hidden aria-hidden="true">
  <div class="aviso-cookies-caixa">
    <p class="aviso-cookies-txt">
      <strong>Cookies e medição.</strong>
      Cookies de medição só são ativados se você aceitar.
      <a href="{% url 'core:politica_privacidade' %}">Política de privacidade</a>.
    </p>
    <div class="aviso-cookies-acoes">
      <button type="button" class="aviso-cookies-btn aviso-cookies-sim" data-consent-aceitar>Aceitar</button>
      <button type="button" class="aviso-cookies-btn aviso-cookies-nao" data-consent-recusar>Recusar</button>
    </div>
  </div>
</section>
<style>
  .aviso-cookies {
    position: fixed; z-index: 90; left: 0; right: 0; bottom: 0;
    padding: 0 16px 16px;
    font-family: inherit;
  }
  .aviso-cookies[hidden] { display: none; }
  /* Enquanto o aviso está na tela, o fim da página ganha a altura dele de folga
     — senão o que estiver embaixo (um formulário, o botão do WhatsApp, um link
     de ajuda) fica coberto e ninguém descobre que existe. O JS mede e põe a
     classe; quando o aviso some, a folga some junto. */
  html.com-aviso-cookies body { padding-bottom: var(--aviso-cookies-altura, 0px); }
  .aviso-cookies-caixa {
    display: flex; align-items: center; gap: 16px 20px; flex-wrap: wrap;
    max-width: 960px; margin: 0 auto; padding: 16px 20px;
    background: var(--superficie, #FFFFFF);
    color: var(--tinta, #2C2722);
    border: 1px solid var(--fio-forte, rgba(79, 44, 29, .22));
    border-radius: var(--raio, 14px);
    box-shadow: 0 18px 44px rgba(5, 28, 44, .22);
  }
  .aviso-cookies-txt { flex: 1 1 320px; margin: 0; font-size: 0.875rem; line-height: 1.55; }
  .aviso-cookies-txt a { color: var(--madeira, #4F2C1D); text-decoration: underline; }
  .aviso-cookies-acoes { display: flex; gap: 10px; flex: 0 0 auto; }
  /* Aceitar e Recusar com o MESMO peso: mesmo tamanho, mesma fonte, mesma área
     de toque (44px). O que muda é só a cor — nada de "recusar" escondido. */
  .aviso-cookies-btn {
    min-height: 44px; min-width: 116px; padding: 11px 20px;
    font: inherit; font-size: 0.875rem; font-weight: 700; line-height: 1;
    border-radius: 999px; cursor: pointer;
  }
  .aviso-cookies-sim {
    color: var(--noturno, #051C2C);
    background: var(--lampiao, #D7A048);
    border: 1px solid var(--lampiao, #D7A048);
  }
  .aviso-cookies-nao {
    color: var(--tinta, #2C2722);
    background: var(--superficie-2, #F7F5F1);
    border: 1px solid var(--fio-forte, rgba(79, 44, 29, .3));
  }
  .aviso-cookies-btn:hover { filter: brightness(.97); }
  .aviso-cookies-btn:active { transform: translateY(1px); }
  .aviso-cookies-btn:focus-visible {
    outline: 2px solid var(--madeira, #4F2C1D);
    outline-offset: 2px;
    box-shadow: 0 0 0 3px rgba(215, 160, 72, .35);
  }
  @media (max-width: 520px) {
    .aviso-cookies { padding:0 8px 8px; }
    .aviso-cookies-caixa { padding:12px; gap:10px; }
    .aviso-cookies-txt { font-size:0.8125rem; line-height:1.4; }
    .aviso-cookies-acoes { width: 100%; }
    .aviso-cookies-btn { flex: 1; }
  }
</style>
<script src="{% static 'js/consentimento.js' %}" defer></script>
