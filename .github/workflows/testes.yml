name: Testes

# Roda a suíte do Django contra PostgreSQL de verdade (a trava de overbooking usa
# ExclusionConstraint/btree_gist, que o SQLite não tem). É o gate que faltava antes
# do deploy automático da main: marque este job como obrigatório na proteção de branch.
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Suíte Django (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vo
          POSTGRES_PASSWORD: vo_ci
          POSTGRES_DB: crm_vo_testa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "1"
      DATABASE_URL: postgres://vo:vo_ci@localhost:5432/crm_vo_testa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrations em dia com os models
        run: python manage.py makemigrations --check --dry-run

      - name: Suíte de testes
        run: python manage.py test --noinput
