<div class="campo{% if field.errors %} campo-erro{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small class="ajuda">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<small class="erro" role="alert">{{ error }}</small>{% endfor %}
</div>
