name: Testes

# Roda a suíte do Django contra PostgreSQL de verdade (a trava de overbooking usa
# ExclusionConstraint/btree_gist, que o SQLite não tem). É o gate que faltava antes
# do deploy automático da main: marque este job como obrigatório na proteção de branch.
# Também é chamado pelo "Novidades do original" para testar o merge com o original.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Branch ou commit a testar (vazio = o do evento)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  testes:
    name: Suíte Django (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vo
          POSTGRES_PASSWORD: vo_ci
          POSTGRES_DB: crm_vo_testa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "1"
      DATABASE_URL: postgres://vo:vo_ci@localhost:5432/crm_vo_testa
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Lint (config em ruff.toml): tem que dar zero. Fica de fora quando o "Novidades do
      # original" chama este workflow com `ref` para testar o merge com o original — lá o
      # que decide é a suíte; o lint do código que chega se acerta no próprio merge.
      - name: Lint (ruff)
        if: ${{ !inputs.ref }}
        run: |
          pip install ruff==0.15.20
          ruff check apps/ config/

      - name: Migrations em dia com os models
        run: python manage.py makemigrations --check --dry-run

      - name: Suíte de testes
        run: python manage.py test --noinput
