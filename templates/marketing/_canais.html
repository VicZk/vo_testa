<form method="get" class="filtros-chips mkt-canais" aria-label="Filtrar por canal">
  {% for chave, valor in request.GET.items %}{% if chave != 'canal' and chave != 'pagina' %}<input type="hidden" name="{{ chave }}" value="{{ valor }}">{% endif %}{% endfor %}
  {% for item in canais %}<button type="submit" name="canal" value="{{ item.valor }}" class="filtro-chip{% if item.ativo %} ativo{% endif %}" aria-pressed="{{ item.ativo|yesno:'true,false' }}">{{ item.nome }}</button>{% endfor %}
</form>
