{% comment %}Modal da casa: a supervisora devolve o quarto para limpar.
Grava no `status_marcar` de sempre, troca só o quadro e fecha sozinho.{% endcomment %}
<form class="modal-form" method="post"
      action="{% url 'governanca:status_marcar' uh.pk %}"
      hx-post="{% url 'governanca:status_marcar' uh.pk %}"
      hx-target="#gov-quadro" hx-swap="innerHTML"
      hx-on::after-request="if (event.detail.successful) fecharModal()">
  <header class="modal-cabecalho">
    <h2>Devolver o {{ uh.numero }} para limpar</h2>
    <button type="button" class="modal-fechar" onclick="fecharModal()" aria-label="Fechar">&times;</button>
  </header>
  <div class="modal-corpo">
    {% include "governanca/partials/devolver_campos.html" %}
  </div>
  <div class="modal-acoes">
    <button type="button" class="botao-neutro" onclick="fecharModal()">Cancelar</button>
    <button type="submit" class="botao-primario">Devolver para limpar</button>
  </div>
</form>
