name: Segurança

# Gate de segurança no PR, na main e na dev (a dev é o que sobe para a VPS); não
# interfere no deploy do Railway. Na semanal e no disparo manual o gitleaks lê o
# histórico inteiro; no push, só os commits novos.
on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"   # varredura semanal (segunda 09:00 UTC) pega CVE nova em dep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast-deps-secrets:
    name: SAST + dependências + segredos
    runs-on: ubuntu-24.04  # fixo: o ubuntu-latest vira Ubuntu 26 a partir de 19/10/2026
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # histórico completo p/ o gitleaks

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar dependências + ferramentas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit ruff semgrep

      # Só o que vai para produção (requirements.txt). Sem o `-r`, o pip-audit olhava o
      # ambiente inteiro do CI e acusava CVE em pacote que só as ferramentas daqui trazem
      # (ex.: o `mcp` que vem com o semgrep), deixando o gate vermelho sem motivo real.
      - name: pip-audit (CVEs em dependências)
        run: pip-audit -r requirements.txt

      - name: bandit (SAST Python)
        run: bandit -r apps config -ll -x '*/tests.py,*/tests_*.py' --skip B310

      - name: ruff (regras de segurança)
        run: ruff check apps config --select "S105,S106,S107,S608,S301,S302,S324,S501,S602,S605,S611"

      # Bloqueia desde 26/10, com os achados da 1ª varredura fechados. Fica de fora a
      # regra de injeção em CSV: toda célula passa por apps/nucleo/export.py (celula /
      # sanitizar_celula, testados em nucleo/tests_export.py), e o semgrep não acompanha
      # a função. Alarme falso leva `nosemgrep` na linha, com o motivo num comentário.
      - name: semgrep (regras Django/Python/OWASP)
        run: >-
          semgrep --error --config p/django --config p/python --config p/secrets
          --exclude '*/tests.py'
          --exclude-rule python.django.security.injection.csv-writer-injection.csv-writer-injection
          apps config

      - name: Django check --deploy (hardening de settings)
        env:
          DEBUG: "0"
          SECRET_KEY: "ci-dummy-secret-key-com-mais-de-cinquenta-caracteres-aleatorios-xyz"
          ALLOWED_HOSTS: "example.com"
          DATABASE_URL: "sqlite:///ci.db"
        run: python manage.py check --deploy --fail-level WARNING

  gitleaks:
    name: Segredos no histórico (gitleaks)
    runs-on: ubuntu-24.04  # fixo: o ubuntu-latest vira Ubuntu 26 a partir de 19/10/2026
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
