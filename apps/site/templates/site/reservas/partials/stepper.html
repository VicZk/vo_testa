{% load static %}
<div class="reserva-stepper bg-pergaminho/95 backdrop-blur-sm border-b border-madeira/10">
    <div class="max-w-4xl mx-auto px-4 py-4">
        <ol class="flex items-start w-full" aria-label="Etapas da reserva">
            {% for num, label in reserva_passos %}
            <li class="reserva-passo flex-1 min-w-0 relative text-center"{% if num == passo %} aria-current="step"{% endif %}>
                {% if not forloop.last %}<span aria-hidden="true" class="absolute top-4 left-1/2 w-full h-0.5 {% if num < passo %}bg-musgo{% else %}bg-madeira/20{% endif %}"></span>{% endif %}
                <div class="relative z-10 mx-auto w-8 h-8 rounded-full border-2 flex items-center justify-center text-xs font-bold
                    {% if num < passo %}bg-musgo border-musgo text-pergaminho
                    {% elif num == passo %}bg-madeira border-madeira text-pergaminho
                    {% else %}bg-pergaminho border-madeira/30 text-madeira/70{% endif %}">
                    {% if num < passo %}
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                    {% else %}{{ num }}{% endif %}
                </div>
                <span class="block text-xs mt-1 px-1 {% if num == passo %}text-madeira font-semibold{% else %}text-madeira/70{% endif %}">{{ label }}</span>
            </li>
            {% endfor %}
        </ol>
    </div>
</div>
