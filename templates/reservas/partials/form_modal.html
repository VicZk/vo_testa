{% load nucleo_extras %}
{# Conteúdo do modal de nova reserva (carregado e revalidado via HTMX). #}
<form hx-post="{% url 'reservas:nova' %}" hx-target="this" hx-swap="outerHTML" class="modal-form"
      x-data="{ fat: '{{ form.faturamento.value|default:'particular' }}' }"
      @keydown.ctrl.enter.prevent="$el.requestSubmit()"
      @keydown.meta.enter.prevent="$el.requestSubmit()">
  {% csrf_token %}
  <header class="modal-cabecalho">
    <h2>Nova reserva</h2>
    <button type="button" class="modal-fechar" onclick="fecharModal()" aria-label="Fechar">&times;</button>
  </header>

  <div class="modal-corpo">
    {% include "reservas/partials/form_campos.html" %}
  </div>

  <footer class="modal-acoes">
    <button type="submit" class="botao-primario" title="Ctrl+Enter">Criar pré-reserva</button>
    <button type="submit" name="orcamento" value="1" class="botao-neutro">Salvar como orçamento</button>
    <button type="button" class="botao-neutro" onclick="fecharModal()">Cancelar</button>
  </footer>
</form>
