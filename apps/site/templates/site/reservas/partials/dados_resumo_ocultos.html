{% if uh_id %}<input type="hidden" name="uh_id" value="{{ uh_id }}">{% else %}<input type="hidden" name="quarto_id" value="{{ quarto.id }}">{% endif %}
<input type="hidden" name="checkin" value="{{ busca.checkin|date:'Y-m-d' }}">
<input type="hidden" name="checkout" value="{{ busca.checkout|date:'Y-m-d' }}">
<input type="hidden" name="hospedes" value="{{ busca.hospedes }}">
<input type="hidden" name="criancas_0_5" value="{{ busca.criancas_0_5|default:0 }}">
<input type="hidden" name="criancas_6_15" value="{{ busca.criancas_6_15|default:0 }}">
{% if arranjo_sel %}<input type="hidden" name="arranjo" value="{{ arranjo_sel }}">{% endif %}
{% if arranjo_sofa %}<input type="hidden" name="usa_sofa_cama" value="1">{% endif %}
<input type="hidden" name="modalidade" value="{{ modalidade|default:busca.modalidade }}">
<input type="hidden" name="nome" value="{{ dados.nome }}">
<input type="hidden" name="cpf" value="{{ dados.cpf }}">
<input type="hidden" name="email" value="{{ dados.email }}">
<input type="hidden" name="telefone" value="{{ dados.telefone }}">
<input type="hidden" name="observacoes" value="{{ dados.observacoes }}">
