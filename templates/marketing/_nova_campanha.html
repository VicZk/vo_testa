<div class="modal-cabecalho">
  <h2 id="nova-campanha-titulo">Nova campanha</h2>
  <button type="button" class="modal-fechar" onclick="fecharFichaMarketing(this)" aria-label="Fechar">&times;</button>
</div>
<form method="post" action="{% url 'marketing:nova_campanha' %}"{% if em_modal %} hx-post="{% url 'marketing:nova_campanha' %}" hx-target="#modal-conteudo" hx-disabled-elt="find button[type='submit']"{% endif %} class="modal-form mkt-nova-form" data-mkt-edit>
  {% csrf_token %}
  <div class="modal-corpo">
    <p>Comece pelo nome e pelo que deseja conseguir. Você poderá completar o planejamento depois.</p>
    {% include "marketing/_campos.html" %}
    <span class="mkt-save-state" role="status" aria-live="polite"></span>
  </div>
  <div class="modal-acoes">
    <button type="button" class="botao-neutro" onclick="fecharFichaMarketing(this)">Cancelar</button>
    <button type="submit" class="botao-primario">Criar campanha</button>
  </div>
</form>
