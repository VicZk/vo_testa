{% comment %}Prévia de LP (Aprovação de LPs): o mesmo desenho na tela da equipe (CRM,
app.css) e no link de quem aprova (base.css). Só tokens; prefixo lpv- próprio.{% endcomment %}
<style>
.lpv-area { container-type: inline-size; }
.lpv { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; align-items: start; }
@container (width > 62rem) { .lpv { grid-template-columns: minmax(0, 1fr) minmax(19rem, 23rem); } }
.lpv-palco { display: flex; flex-direction: column; gap: .6rem; min-width: 0; }
.lpv-barra { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
.lpv-versoes, .lpv-telas { display: flex; flex-wrap: wrap; gap: .35rem; }
.lpv-telas { margin-left: auto; }
.lpv-nota { margin: 0; font-size: .82rem; color: var(--tinta-suave); overflow-wrap: anywhere; }
.lpv-moldura { display: flex; justify-content: center; background: var(--superficie-2);
  border: 1px solid var(--fio); border-radius: var(--raio); overflow: hidden; }
.lpv-moldura iframe { display: block; width: 100%; height: min(80dvh, 60rem); min-height: 26rem;
  border: 0; background: var(--superficie); }
.lpv-moldura[data-tela="celular"] { padding: 1rem .5rem; }
.lpv-moldura[data-tela="celular"] iframe { width: min(390px, 100%); height: min(80dvh, 844px);
  border: 1px solid var(--fio-forte); border-radius: var(--raio-g); box-shadow: var(--sombra-cartao); }
.lpv-lado { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
.lpv-cartao { background: var(--superficie); border: 1px solid var(--fio); border-radius: var(--raio);
  box-shadow: var(--sombra-cartao); padding: 1rem 1.1rem; min-width: 0; }
.lpv-tit { margin: 0 0 .65rem; font-size: .95rem; font-weight: 650; letter-spacing: -.01em; }
.lpv-tit .lpv-meta { font-weight: 500; }
.lpv-meta { font-size: .76rem; color: var(--tinta-suave); font-variant-numeric: tabular-nums; }
.lpv-form { display: flex; flex-direction: column; gap: .5rem; margin: 0; }
.lpv-form label { font-size: .7rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  color: var(--tinta-suave); }
.lpv-form input[type="text"], .lpv-form input[type="file"], .lpv-form textarea {
  width: 100%; box-sizing: border-box; font: inherit; color: var(--tinta); background: var(--superficie);
  padding: .6rem .7rem; border: 1px solid var(--fio-forte); border-radius: var(--raio-p); }
.lpv-form textarea { resize: vertical; min-height: 5.5rem; }
.lpv-form > .botao-mini, .lpv-com form .botao-mini { align-self: flex-start; }
.lpv-acoes { display: flex; flex-wrap: wrap; gap: .4rem; }
.lpv-acoes > * { flex: 1 1 auto; }
.lpv-dica { margin: 0; font-size: .76rem; line-height: 1.45; color: var(--tinta-suave); }
.lpv-comentarios { list-style: none; margin: 1rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .8rem; }
.lpv-com { padding: .05rem 0 .05rem .75rem; border-left: 3px solid var(--fio-forte); min-width: 0; }
.lpv-com--ajuste { border-left-color: var(--alerta); }
.lpv-com--aprovacao { border-left-color: var(--sucesso); }
.lpv-com.resolvido { opacity: .62; }
.lpv-com-cab { display: flex; flex-wrap: wrap; align-items: baseline; gap: .1rem .45rem; }
.lpv-com p { margin: .25rem 0 .35rem; font-size: .88rem; line-height: 1.5; overflow-wrap: anywhere; }
@media (pointer: coarse) {
  .lpv-form button, .lpv-barra a, .lpv-barra button, .lpv-com button { min-height: 44px; }
}
@media print { .lpv-form, .lpv-barra { display: none; } }
</style>
